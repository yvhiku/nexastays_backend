# Immutable release compose for all user-facing Nexa services.
#
# Usage (on deploy host under /opt/nexa/backend/deploy):
#   export BACKEND_IMAGE_TAG=<git-sha>
#   export WEB_IMAGE_TAG=<git-sha>
#   export DASHBOARD_IMAGE_TAG=<git-sha>
#   bash scripts/check-env.sh
#   bash scripts/remote-deploy.sh
#
# Never use latest as a release identity.
# App ports bind to 127.0.0.1 — terminate TLS at the host reverse proxy.
# Postgres/Redis stay on the host (database/docker-compose.yml), not in this file.

name: nexa-release

services:
  identity:
    image: ${IMAGE_REGISTRY}/nexa-identity:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDENTITY_HOST_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, data]
    env_file:
      - path: .env
        required: true
      - path: .env.identity
        required: true
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXA_SERVICE_NAME: nexa-identity
      GIT_SHA: ${BACKEND_IMAGE_TAG}
      IMAGE_TAG: ${BACKEND_IMAGE_TAG}
      BUILD_VERSION: ${BUILD_VERSION:-}
      BUILD_TIME: ${BUILD_TIME:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  stays:
    image: ${IMAGE_REGISTRY}/nexa-stays:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAYS_HOST_PORT:-3002}:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, data]
    env_file:
      - path: .env
        required: true
      - path: .env.stays
        required: true
    environment:
      NODE_ENV: production
      PORT: "3002"
      NEXA_SERVICE_NAME: nexa-stays
      GIT_SHA: ${BACKEND_IMAGE_TAG}
      IMAGE_TAG: ${BACKEND_IMAGE_TAG}
      BUILD_VERSION: ${BUILD_VERSION:-}
      BUILD_TIME: ${BUILD_TIME:-}
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3002/api/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  notifications:
    image: ${IMAGE_REGISTRY}/nexa-notifications:${PLATFORM_IMAGE_TAG:-${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG required}}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOTIFICATIONS_HOST_PORT:-3003}:3003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, data]
    env_file:
      - path: .env
        required: true
      - path: .env.notifications
        required: true
    environment:
      NODE_ENV: production
      PORT: "3003"
      NEXA_SERVICE_NAME: nexa-notifications
      GIT_SHA: ${PLATFORM_IMAGE_TAG:-${BACKEND_IMAGE_TAG}}
      # Soft-launch: set PUSH_DISABLED=true until FCM is wired
      PUSH_DISABLED: ${PUSH_DISABLED:-true}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect({port:3003,host:'127.0.0.1'},()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  media:
    image: ${IMAGE_REGISTRY}/nexa-media:${PLATFORM_IMAGE_TAG:-${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG required}}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEDIA_HOST_PORT:-3004}:3004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, data]
    env_file:
      - path: .env
        required: true
      - path: .env.media
        required: true
    environment:
      NODE_ENV: production
      PORT: "3004"
      NEXA_SERVICE_NAME: nexa-media
      GIT_SHA: ${PLATFORM_IMAGE_TAG:-${BACKEND_IMAGE_TAG}}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect({port:3004,host:'127.0.0.1'},()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  consumers:
    image: ${IMAGE_REGISTRY}/nexa-consumers:${PLATFORM_IMAGE_TAG:-${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG required}}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, data]
    env_file:
      - path: .env
        required: true
      - path: .env.consumers
        required: false
    environment:
      NODE_ENV: production
      NEXA_SERVICE_NAME: nexa-consumers
      GIT_SHA: ${PLATFORM_IMAGE_TAG:-${BACKEND_IMAGE_TAG}}
      EVENT_BUS_CONSUMER_GROUP: nexa-consumers
    stop_grace_period: 30s

  web:
    image: ${IMAGE_REGISTRY}/nexa-web:${WEB_IMAGE_TAG:?WEB_IMAGE_TAG required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3005}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      GIT_SHA: ${WEB_IMAGE_TAG}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/en',headers:{host:'nexastays.ma','x-forwarded-proto':'https'}},r=>process.exit(r.statusCode>=200&&r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    image: ${IMAGE_REGISTRY}/nexa-dashboard:${DASHBOARD_IMAGE_TAG:?DASHBOARD_IMAGE_TAG required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3010}:3010"
    environment:
      NODE_ENV: production
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
      GIT_SHA: ${DASHBOARD_IMAGE_TAG}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3010/',r=>process.exit(r.statusCode>=200&&r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
  data:
    external: true
    name: nexastays_db_default
