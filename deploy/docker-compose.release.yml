# PROD-OPS-002 / VPS dogfood — Identity + Stays release compose
#
# Usage (on deploy host under /opt/nexa/backend/deploy):
#   export IMAGE_TAG=<git-sha>
#   bash scripts/check-env.sh
#   bash scripts/remote-deploy.sh
#
# Never use IMAGE_TAG=latest as release identity.
# App ports bind to 127.0.0.1 — terminate TLS at the host reverse proxy.
# Postgres/Redis stay on the host (database/docker-compose.yml), not in this file.

name: nexa-release

services:
  identity:
    image: ${IMAGE_REGISTRY}/nexa-identity:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDENTITY_HOST_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: true
      - path: .env.identity
        required: true
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXA_SERVICE_NAME: nexa-identity
      GIT_SHA: ${IMAGE_TAG}
      IMAGE_TAG: ${IMAGE_TAG}
      BUILD_VERSION: ${BUILD_VERSION:-}
      BUILD_TIME: ${BUILD_TIME:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  stays:
    image: ${IMAGE_REGISTRY}/nexa-stays:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAYS_HOST_PORT:-3002}:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: true
      - path: .env.stays
        required: true
    environment:
      NODE_ENV: production
      PORT: "3002"
      NEXA_SERVICE_NAME: nexa-stays
      GIT_SHA: ${IMAGE_TAG}
      IMAGE_TAG: ${IMAGE_TAG}
      BUILD_VERSION: ${BUILD_VERSION:-}
      BUILD_TIME: ${BUILD_TIME:-}
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3002/api/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
