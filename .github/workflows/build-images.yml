name: Build backend release images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-backend-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nexa-identity
            dockerfile: nexastays_backend/deploy/docker/Dockerfile.backend
            service: identity
          - image: nexa-stays
            dockerfile: nexastays_backend/deploy/docker/Dockerfile.backend
            service: stays
          - image: nexa-notifications
            dockerfile: nexastays_backend/deploy/docker/Dockerfile.platform
            service: notifications-service
          - image: nexa-media
            dockerfile: nexastays_backend/deploy/docker/Dockerfile.platform
            service: media-service
          - image: nexa-consumers
            dockerfile: nexastays_backend/deploy/docker/Dockerfile.platform
            service: consumers
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: nexastays_backend

      - name: Checkout shared platform
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nexastays_platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          path: nexastays_platform

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Minimize multi-repository Docker context
        run: |
          printf '%s\n' '**/.git' '**/node_modules' '**/dist' '**/.env*' > .dockerignore

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish immutable release identity
        run: echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}"
