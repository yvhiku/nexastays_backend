name: Deploy production

on:
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: "Backend Git SHA previously verified on staging"
        required: true
        type: string
      web_image_tag:
        description: "Web Git SHA previously verified on staging"
        required: true
        type: string
      dashboard_image_tag:
        description: "Dashboard Git SHA previously verified on staging"
        required: true
        type: string
      confirm_production:
        description: "Type PRODUCTION to proceed"
        required: true
        type: string
      skip_migrate:
        description: "Emergency only — skip DB migrate (1=yes)"
        required: false
        default: "0"
        type: string

# Never deploy production from PR branches automatically.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Confirm production intent
        run: |
          if [[ "${{ inputs.confirm_production }}" != "PRODUCTION" ]]; then
            echo "Type PRODUCTION to confirm" >&2
            exit 1
          fi
          for TAG in "${{ inputs.backend_image_tag }}" "${{ inputs.web_image_tag }}" "${{ inputs.dashboard_image_tag }}"; do
            [[ "$TAG" =~ ^[0-9a-f]{7,64}$ ]] || { echo "Invalid immutable image tag" >&2; exit 1; }
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [[ -z "${DEPLOY_SSH_KEY}" ]]; then
            echo "DEPLOY_SSH_KEY not configured — production deploy IMPLEMENTED, NOT VERIFIED." >&2
            echo "::error::Configure GitHub Environment 'production' secrets (deploy/README.md)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync deploy package
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_REMOTE: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Host-owned secrets (.env, .env.identity, .env.stays, …) are excluded —
          # see deploy/scripts/ci-rsync-excludes.txt (B1).
          bash deploy/scripts/sync-deploy-package.sh \
            deploy/ \
            "${USER}@${HOST}:${PATH_REMOTE}/"

      - name: Remote migrate + compose up
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_REMOTE: ${{ secrets.DEPLOY_PATH }}
          DB_REPO: ${{ secrets.DATABASE_REPO_PATH }}
        run: |
          ssh -o BatchMode=yes "${USER}@${HOST}" \
            "cd '${PATH_REMOTE}' && \
             export BACKEND_IMAGE_TAG='${{ inputs.backend_image_tag }}' \
                    WEB_IMAGE_TAG='${{ inputs.web_image_tag }}' \
                    DASHBOARD_IMAGE_TAG='${{ inputs.dashboard_image_tag }}' \
                    DATABASE_REPO_PATH='${DB_REPO}' \
                    SKIP_MIGRATE='${{ inputs.skip_migrate }}' && \
             bash scripts/remote-deploy.sh"

      - name: Smoke tests
        env:
          SMOKE_IDENTITY_BASE_URL: ${{ secrets.SMOKE_IDENTITY_BASE_URL }}
          SMOKE_STAYS_BASE_URL: ${{ secrets.SMOKE_STAYS_BASE_URL }}
          SMOKE_CORS_ORIGIN_OK: ${{ secrets.SMOKE_CORS_ORIGIN_OK }}
          SMOKE_CORS_ORIGIN_BAD: ${{ secrets.SMOKE_CORS_ORIGIN_BAD }}
          SMOKE_EXPECT_NEXA_ENV: production
          SMOKE_EXPECT_SWAGGER: "false"
          SMOKE_WEB_BASE_URL: ${{ secrets.SMOKE_WEB_BASE_URL }}
          SMOKE_DASHBOARD_BASE_URL: ${{ secrets.SMOKE_DASHBOARD_BASE_URL }}
        run: |
          if [[ -z "${SMOKE_IDENTITY_BASE_URL}" || -z "${SMOKE_STAYS_BASE_URL}" ]]; then
            echo "Smoke URL secrets missing — fail closed." >&2
            exit 1
          fi
          bash deploy/scripts/smoke.sh
          bash deploy/scripts/smoke-web-release.sh
