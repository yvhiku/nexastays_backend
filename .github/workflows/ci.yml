name: Backend CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: identity/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  stays:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stays
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stays/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  stays-pg-concurrency:
    name: stays PROD-INV-001 PostgreSQL concurrency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stays
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexa_stays
          POSTGRES_PASSWORD: nexa_stays_dev
          POSTGRES_DB: nexa_stays
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U nexa_stays -d nexa_stays"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAYS_PG_CONCURRENCY: "1"
      STAYS_PG_CONCURRENCY_BOOTSTRAP: "1"
      STAYS_PG_HOST: 127.0.0.1
      STAYS_PG_PORT: "5434"
      STAYS_PG_USER: nexa_stays
      STAYS_PG_PASSWORD: nexa_stays_dev
      STAYS_PG_DATABASE: nexa_stays
      STAYS_PG_CONCURRENCY_STRESS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stays/package-lock.json
      - run: npm ci
      - run: npm run test:pg-concurrency

  deploy-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release compose
        run: docker compose -f deploy/docker-compose.release.yml config --quiet
        env:
          IMAGE_REGISTRY: ghcr.io/example
          IMAGE_TAG: deadbeef
      - name: Shell syntax (deploy scripts)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck || true
          bash -n deploy/scripts/*.sh
          if command -v shellcheck >/dev/null; then shellcheck -x deploy/scripts/*.sh || true; fi
      - name: Reject latest as default in docs/scripts
        run: |
          if grep -RIn --exclude-dir=.git 'IMAGE_TAG=latest' deploy/; then
            echo "Found IMAGE_TAG=latest" >&2
            exit 1
          fi
          if grep -RInE 'image:.*:latest' deploy/docker-compose.release.yml; then
            echo "Found :latest image tag" >&2
            exit 1
          fi
      - name: check-env rejects production+mock
        run: |
          cat > /tmp/bad.env <<'EOF'
          NEXA_ENV=production
          NODE_ENV=production
          IMAGE_TAG=abc123
          IMAGE_REGISTRY=ghcr.io/x
          DB_PASSWORD=x
          PII_ENCRYPTION_KEY=x
          JWT_PRIVATE_KEY=x
          JWT_PUBLIC_KEY=x
          JWT_ISSUER=x
          JWT_AUDIENCE=x
          CORS_ORIGINS=https://a.example
          INTERNAL_SERVICE_KEY=x
          ADMIN_PASSWORD_HASH=x
          STAYS_PAYMENT_PROVIDER=mock
          EOF
          if bash deploy/scripts/check-env.sh /tmp/bad.env; then
            echo "expected failure for production+mock" >&2
            exit 1
          fi
      - name: check-env accepts dogfood+mock
        run: |
          cat > /tmp/ok.env <<'EOF'
          NEXA_ENV=dogfood
          NODE_ENV=production
          IMAGE_TAG=abc123
          IMAGE_REGISTRY=ghcr.io/x
          DB_PASSWORD=x
          PII_ENCRYPTION_KEY=x
          JWT_PRIVATE_KEY=x
          JWT_PUBLIC_KEY=x
          JWT_ISSUER=x
          JWT_AUDIENCE=x
          CORS_ORIGINS=https://a.example
          INTERNAL_SERVICE_KEY=x
          ADMIN_PASSWORD_HASH=x
          STAYS_PAYMENT_PROVIDER=mock
          EOF
          bash deploy/scripts/check-env.sh /tmp/ok.env
