name: Backend CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: identity/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  stays:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stays
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stays/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  stays-pg-concurrency:
    name: stays PROD-INV-001 PostgreSQL concurrency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stays
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexa_stays
          POSTGRES_PASSWORD: nexa_stays_dev
          POSTGRES_DB: nexa_stays
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U nexa_stays -d nexa_stays"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAYS_PG_CONCURRENCY: "1"
      STAYS_PG_CONCURRENCY_BOOTSTRAP: "1"
      STAYS_PG_HOST: 127.0.0.1
      STAYS_PG_PORT: "5434"
      STAYS_PG_USER: nexa_stays
      STAYS_PG_PASSWORD: nexa_stays_dev
      STAYS_PG_DATABASE: nexa_stays
      STAYS_PG_CONCURRENCY_STRESS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stays/package-lock.json
      - run: npm ci
      - run: npm run test:pg-concurrency

  deploy-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release compose
        run: docker compose -f deploy/docker-compose.release.yml config --quiet
        env:
          IMAGE_REGISTRY: ghcr.io/example
          BACKEND_IMAGE_TAG: deadbeef
          WEB_IMAGE_TAG: deadbeef
          DASHBOARD_IMAGE_TAG: deadbeef
      - name: Shell syntax (deploy scripts)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck || true
          bash -n deploy/scripts/*.sh
          if command -v shellcheck >/dev/null; then shellcheck -x deploy/scripts/*.sh || true; fi
      - name: Reject latest as default in docs/scripts
        run: |
          if grep -RInE 'image:.*:latest' deploy/docker-compose.release.yml; then
            echo "Found :latest image tag" >&2
            exit 1
          fi
      - name: Deployment environment policy regression
        run: bash deploy/scripts/test-check-env.sh
