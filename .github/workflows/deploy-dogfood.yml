name: Deploy dogfood

on:
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: "Backend Git SHA image tag"
        required: true
        type: string
      web_image_tag:
        description: "Web Git SHA image tag"
        required: true
        type: string
      dashboard_image_tag:
        description: "Dashboard Git SHA image tag"
        required: true
        type: string
      skip_migrate:
        description: "Emergency only — skip DB migration"
        required: false
        default: "0"
        type: string
      skip_backup:
        description: "Emergency only — skip pre-migration backup"
        required: false
        default: "0"
        type: string

concurrency:
  group: deploy-dogfood
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dogfood
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable tags
        run: |
          for TAG in "${{ inputs.backend_image_tag }}" "${{ inputs.web_image_tag }}" "${{ inputs.dashboard_image_tag }}"; do
            [[ "$TAG" =~ ^[0-9a-f]{7,64}$ ]] || { echo "Invalid immutable image tag" >&2; exit 1; }
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync deploy package
        run: |
          bash deploy/scripts/sync-deploy-package.sh deploy/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Backup, migrate, deploy, and wait healthy
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             export BACKEND_IMAGE_TAG='${{ inputs.backend_image_tag }}' \
                    WEB_IMAGE_TAG='${{ inputs.web_image_tag }}' \
                    DASHBOARD_IMAGE_TAG='${{ inputs.dashboard_image_tag }}' \
                    DATABASE_REPO_PATH='${{ secrets.DATABASE_REPO_PATH }}' \
                    SKIP_MIGRATE='${{ inputs.skip_migrate }}' \
                    SKIP_BACKUP='${{ inputs.skip_backup }}' && \
             bash scripts/remote-deploy.sh"

      - name: Public smoke tests
        env:
          SMOKE_IDENTITY_BASE_URL: ${{ secrets.SMOKE_IDENTITY_BASE_URL }}
          SMOKE_STAYS_BASE_URL: ${{ secrets.SMOKE_STAYS_BASE_URL }}
          SMOKE_CORS_ORIGIN_OK: ${{ secrets.SMOKE_CORS_ORIGIN_OK }}
          SMOKE_CORS_ORIGIN_BAD: ${{ secrets.SMOKE_CORS_ORIGIN_BAD }}
          SMOKE_EXPECT_NEXA_ENV: dogfood
          SMOKE_WEB_BASE_URL: ${{ secrets.SMOKE_WEB_BASE_URL }}
          SMOKE_DASHBOARD_BASE_URL: ${{ secrets.SMOKE_DASHBOARD_BASE_URL }}
        run: |
          bash deploy/scripts/smoke.sh
          bash deploy/scripts/smoke-web-release.sh
