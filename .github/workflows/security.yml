name: Production security

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, stays]
    defaults:
      run:
        working-directory: nexastays_backend/${{ matrix.service }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: nexastays_backend
      - name: Checkout shared platform
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nexastays_platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          path: platform
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            nexastays_backend/${{ matrix.service }}/package-lock.json
            platform/event-bus/package-lock.json
            platform/identity-read-model/package-lock.json
            platform/telemetry/package-lock.json
      - name: Install shared platform dependencies
        working-directory: platform
        run: npm ci --prefix event-bus && npm ci --prefix identity-read-model && npm ci --prefix telemetry
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test -- --runInBand --testPathPatterns="security|pii-encryption"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
